    <div id="touch">
      <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
      <div id="btns">
        <button class="tb" data-b="special" id="b-special">气</button>
        <button class="tb" data-b="dodge" id="b-dodge">闪</button>
        <button class="tb" data-b="jump" id="b-jump">跳</button>
        <button class="tb" data-b="kick" id="b-kick">腿</button>
        <button class="tb big" data-b="punch" id="b-punch">拳</button>
      </div>
      <button class="tb small" data-b="back" id="b-pause">II</button>
    </div>
    <div id="touchmenu">
      <button class="tb small" data-b="start" id="m-ok">确定</button>
      <button class="tb small" data-b="back" id="m-back">返回</button>
    </div>
    <div id="rotate">
      <div class="phone"></div>
      <p>请将手机横屏游玩</p>
      <p class="en">Rotate your phone to landscape</p>
    </div>
    <noscript><p style="color:#fff;text-align:center">需要启用 JavaScript 才能游玩。</p></noscript>
